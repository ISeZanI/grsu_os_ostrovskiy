worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
}

http {
    upstream OSTROVSKIY_backend {
        server 127.0.0.1:8080;
        server 127.0.0.1:8081;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://OSTROVSKIY_backend;
        }
    }
}
